# Local Postgres for hosted-mode development and the Postgres test suite (#248).
#
#   docker compose -f docker-compose.dev.yml up -d --wait
#   export DATABASE_URL=postgres://iris:iris@127.0.0.1:55432/iris
#   npm run db:migrate
#
# The tests take an admin URL instead and create a throwaway database per file:
#   IRIS_TEST_DATABASE_URL=postgres://iris:iris@127.0.0.1:55432/postgres npm test
#
# Mailpit catches the portal's account mail (#249). Its web UI and API are on
# http://127.0.0.1:58025, and the portal sends to it with
#   SMTP_URL=smtp://127.0.0.1:51025
#
# SeaweedFS is the S3-compatible artifact store (#257; owner decision: SeaweedFS in
# dev, CI and staging). docker/seaweedfs-s3.dev.json defines its one identity, which
# also makes the server refuse anonymous requests, so buckets are private. Tests:
#   IRIS_TEST_S3_ENDPOINT=http://127.0.0.1:58333 IRIS_TEST_S3_ACCESS_KEY_ID=iris-dev-access \
#   IRIS_TEST_S3_SECRET_ACCESS_KEY=iris-dev-secret-key npm test
#
# Development only: the password is in this file. Staging keeps its own in a
# secret file (docker-compose.staging.yml).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris
      POSTGRES_DB: iris
    # Loopback, and not 5432: the shared host may already run a Postgres there.
    ports:
      - '127.0.0.1:${IRIS_PG_PORT:-55432}:5432'
    volumes:
      - iris-pg-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U iris -d iris']
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:${IRIS_SMTP_PORT:-51025}:1025'
      - '127.0.0.1:${IRIS_MAILPIT_PORT:-58025}:8025'

  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ['server', '-s3', '-s3.config=/etc/seaweedfs/s3.json', '-dir=/data']
    ports:
      - '127.0.0.1:${IRIS_S3_PORT:-58333}:8333'
    volumes:
      - ./docker/seaweedfs-s3.dev.json:/etc/seaweedfs/s3.json:ro
      - iris-s3-dev:/data

volumes:
  iris-pg-dev:
  iris-s3-dev:
