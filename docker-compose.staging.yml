# Staging runtime for IRIS (issue #192).
#
# Committed so the port, environment, restart policy and healthcheck are
# reviewable in a diff. That is the substantive difference from the pm2 setup it
# replaces: pm2 captures the environment at `pm2 start` and replays boot state
# from a `dump.pm2` snapshot someone has to remember to `pm2 save`, so what comes
# back after a reboot is whatever was saved, whenever that was. Here the running
# state is derived from this file, and `docker compose up -d` is idempotent.

services:
  iris:
    image: ghcr.io/frankbria/iris:${IRIS_TAG:-staging}
    container_name: iris-staging
    restart: unless-stopped

    # Host side is pinned to loopback ON PURPOSE. This service drives a real
    # browser and speaks an RPC that can navigate anywhere, so anything routable
    # that reaches it is an SSRF engine with one bearer token in front. Reach it
    # over SSH or the tailnet; do not publish it on 0.0.0.0, and do not put it
    # behind nginx on 443 without first deciding what authenticates.
    #
    # The container-side bind is 0.0.0.0 (set in the Dockerfile) because Docker
    # forwards a published port to the container's network interface, not its
    # loopback.
    ports:
      - '127.0.0.1:4000:4000'

    environment:
      # The token is a file, not an env var (#332): an environment is readable by
      # anyone who can `docker inspect` the container, and by every process in
      # it. Stable across restarts, unlike the per-start random token, so clients
      # and the healthcheck keep working after a bounce.
      IRIS_CONNECT_TOKEN_FILE: /run/secrets/connect_token
      # Keep run history inside the named volume rather than the container layer.
      IRIS_DB_PATH: /data/iris.db

    # A bind mount, so the container sees the host file's own owner and mode:
    # it must be readable by pwuser (uid 1001). Keep it inside a 0700 directory
    # so that on a shared host, whoever holds uid 1001 there cannot reach it.
    secrets:
      - connect_token

    volumes:
      - iris-data:/data

    # --- runtime hardening (#332) ---------------------------------------------
    # Every session spawns a Chromium that renders arbitrary pages; these bound
    # what one that goes wrong, or is made to go wrong, can do to the box.

    # Node as PID 1 does not reap orphans, so Chromium's exited helpers piled up
    # as zombies. Docker's init (tini) reaps them and forwards SIGTERM.
    init: true

    # The Chromium sandbox needs no capabilities — it uses unprivileged user
    # namespaces — and nothing else here binds a low port or changes ownership.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # Docker's default profile plus one rule: user namespaces without
      # CAP_SYS_ADMIN, which Chromium's sandbox needs. Without it a sandboxed
      # launch fails with "Chromium could not start its sandbox". Details in the
      # rule's own comment inside the file.
      - seccomp=./docker/seccomp-chromium.json

    # Nothing in the image may change at runtime. Chromium writes its profile
    # to /tmp and caches under $HOME; run history goes to the /data volume.
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/pwuser:size=256m,uid=1001,gid=1001,mode=0700

    # Sized for a handful of concurrent sessions on a shared box: each Chromium
    # takes roughly 150-400 MB, and the shm below counts against this limit.
    mem_limit: 3g
    cpus: '2'
    # Threads count as pids. The idle server is ~20 and each browser session
    # with a page open adds ~60 (measured in this image), so this leaves room
    # for about 15 sessions while a runaway process tree cannot exhaust the
    # host's process table.
    pids_limit: 1024
    # `iris connect` closes client sockets on SIGTERM and force-exits after 5s
    # (src/cli.ts); Docker's default 10s would SIGKILL a slow drain first.
    stop_grace_period: 20s

    # An authenticated JSON-RPC round trip, not a TCP open: a listening socket
    # says nothing about whether the token is accepted or the RPC layer answers.
    #
    # It deliberately stops short of launching a browser. `getStatus` reports
    # ready without touching Chromium, so this does NOT prove the browser layer
    # works — the deploy verifies that once, through IRIS's own launch factory
    # (`launchBrowser()` in dist/browser.js). Launching Chromium every 30s would burn
    # memory on a shared box and make the probe its own stability risk.
    #
    # Lives in docker/healthcheck.js because compose reads `${...}` in an inline
    # script as its own interpolation syntax.
    healthcheck:
      test: ['CMD', 'node', '/app/docker/healthcheck.js']
      interval: 30s
      timeout: 15s
      # Chromium's first launch after a cold start is slow; a short grace period
      # would report a healthy service as failed while it is still warming.
      start_period: 60s
      retries: 3

    # Chromium needs more than Docker's 64 MB default here — a page render can
    # exhaust it and the crash surfaces as an opaque browser disconnect.
    shm_size: 1gb

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  iris-data:

# Written by the deploy (ci.yml) to /opt/iris/secrets/connect_token. Never commit it.
secrets:
  connect_token:
    file: ./secrets/connect_token
