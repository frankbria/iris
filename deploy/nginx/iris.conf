# IRIS ingress (#347, ADR 0001 §1): the only public listener. TLS ends here; the
# portal and iris-api listen on loopback behind it.
#
# A site file for the host's nginx: it is included inside `http {}` (e.g. from
# /etc/nginx/conf.d/ or sites-enabled/), which is why `limit_req_zone` and `map` can
# sit at the top. Fill in before installing, then `nginx -t` and reload:
#   - server_name       iris.example.com (both server blocks)
#   - certificate       /etc/ssl/iris/fullchain.pem, /etc/ssl/iris/privkey.pem
#   - iris-api upstream 127.0.0.1:4000 (where `iris connect` listens)
#   - portal upstream   127.0.0.1:3000 (where `next start` listens)
#
# Names are prefixed `iris_` because zones and map variables are global to the whole
# nginx: a second `$connection_upgrade` in another site would fail `nginx -t`.

# Per-client-IP throttles, applied before any request reaches auth.
# /v1/: 5 r/s (300/min) per IP, burst 20. That is an org's whole RPC/REST ceiling
#   (orgRequestsPerMinute 300; one key gets 120/min), so one address cannot send more
#   than a whole tenant may. It counts requests and WebSocket upgrades, not messages
#   on an open socket. Each unauthenticated upgrade costs the server two DB round trips
#   and a `maxConnections` slot (#341), which is what this caps.
limit_req_zone $binary_remote_addr zone=iris_api:10m rate=5r/s;
# /api/auth/: 10 r/s per IP, burst 20, matching BetterAuth's general 100 per 10s. Its
#   own per-route rules (sign-in/up 3 per 10s) still apply behind this; this is the
#   flood guard, and every page load calls get-session.
limit_req_zone $binary_remote_addr zone=iris_auth:10m rate=10r/s;

map $http_upgrade $iris_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name iris.example.com;
    server_tokens off;

    # certbot's webroot challenge; everything else goes to https.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name iris.example.com;
    server_tokens off;

    ssl_certificate     /etc/ssl/iris/fullchain.pem;
    ssl_certificate_key /etc/ssl/iris/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:iris_ssl:10m;

    # The RPC server takes 1 MiB frames (maxPayloadBytes) and the job API 64 KiB
    # bodies; Next's server actions default to 1 MB. The upstreams enforce their own.
    client_max_body_size 1m;

    # Only at server level. nginx inherits add_header into a location only when the
    # location has none of its own, so one add_header below would drop all of these.
    # `always` puts them on nginx's own 429s and 5xx too.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    limit_req_status 429;

    # Overwrite, never append ($proxy_add_x_forwarded_for appends): the upstreams see
    # the peer address, never a value the client chose. BetterAuth keys its rate limits
    # on X-Real-IP (src/auth/config.ts). proxy_set_header inherits like add_header: a
    # location that sets any gets none of these, so /v1/ repeats them all.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The RPC server gives a loopback peer with this header one connection beyond its
    # cap (the healthcheck's slot, #342). Behind this proxy every peer is loopback.
    proxy_set_header X-Iris-Probe "";
    proxy_http_version 1.1;

    # iris-api: RPC over WebSocket and the job REST API.
    location /v1/ {
        limit_req zone=iris_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Iris-Probe "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $iris_connection_upgrade;
        # The server pings every 30s (heartbeatIntervalMs); idle sockets must outlive it.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # BetterAuth's routes, throttled per IP.
    location /api/auth/ {
        limit_req zone=iris_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
