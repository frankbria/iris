name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Read from .nvmrc so CI and local environments cannot drift apart —
          # that drift is what hid the engines mismatch in issue #138.
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Tests launch a real browser; install Chromium + its OS deps first.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
