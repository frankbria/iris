name: CI
# `push` with no filter is every branch and every tag, exactly as `[push, pull_request]`
# was. A `v*` tag push also runs deploy-production (#273), as does a manual dispatch
# from a `v*` tag.
on:
  push:
  pull_request:
  # Production only: run it from a `v*` tag (Use workflow from: Tags). From a branch,
  # deploy-production does not run; build does, as on a push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The hosted database (#248): the migration runner and the Postgres suite run
    # against a real server. Credentials are throwaway, like the container.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris
          POSTGRES_DB: iris
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iris -d iris"
          --health-interval 2s --health-timeout 5s --health-retries 30
      # SMTP catcher for the portal's account mail (#249). Same ports as
      # docker-compose.dev.yml, so the E2E defaults apply unchanged.
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 51025:1025
          - 58025:8025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Read from .nvmrc so CI and local environments cannot drift apart —
          # that drift is what hid the engines mismatch in issue #138.
          # Pinned to 24: better-sqlite3 13 requires >=22, and 24 is the current
          # LTS line, so CI exercises what most contributors will actually run.
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Tests launch a real browser; install Chromium + its OS deps first.
      - run: npx playwright install --with-deps chromium
      # age encrypts the backups in backup-script.test.ts (#274), as on the box.
      - run: sudo apt-get update
      - run: sudo apt-get install -y --no-install-recommends age
      # IRIS launches Chromium sandboxed (#331), and ubuntu-24.04's AppArmor
      # blocks the unprivileged user namespaces the sandbox needs ("No usable
      # sandbox!"). Lift the restriction rather than set IRIS_CHROMIUM_SANDBOX=0,
      # so the suite keeps proving a real sandbox, not the opt-out.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Twice: the second run must apply nothing (idempotency on a real database).
      - run: npm run db:migrate && npm run db:migrate
        env:
          DATABASE_URL: postgres://iris:iris@localhost:5432/iris
      # The portal image (#273), built on every run so a broken Dockerfile.portal fails
      # here, not at the first staging deploy. portal-image.test.ts runs it.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.portal
          load: true
          tags: iris-portal:ci
          cache-from: type=gha,scope=portal
          cache-to: type=gha,mode=max,scope=portal
      # The S3-compatible artifact store (#257), as in docker-compose.dev.yml. A step,
      # not a service container: services cannot pass the server its command line.
      - name: Start SeaweedFS
        run: |
          docker run -d --name seaweedfs -p 127.0.0.1:58333:8333 \
            -v "$PWD/docker/seaweedfs-s3.dev.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d \
            server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
          # Ready when the S3 port answers (anonymous requests get 403).
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:58333/)" = 403 ] && exit 0
            sleep 1
          done
          docker logs seaweedfs; exit 1
      # IRIS_TEST_DATABASE_URL is an admin URL; the suite creates a database per
      # file. Required under CI, so a missing service fails rather than skips.
      - run: npm test
        env:
          IRIS_TEST_DATABASE_URL: postgres://iris:iris@localhost:5432/postgres
          IRIS_TEST_PORTAL_IMAGE: iris-portal:ci
          IRIS_TEST_S3_ENDPOINT: http://127.0.0.1:58333
          IRIS_TEST_S3_ACCESS_KEY_ID: iris-dev-access
          IRIS_TEST_S3_SECRET_ACCESS_KEY: iris-dev-secret-key
      # apps/portal (#247). `next build` type-checks, so there is no separate step.
      - run: npm run lint -w @iris/portal
      - run: npm test -w @iris/portal
      - run: npm run build -w @iris/portal
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      # The portal's @playwright/test may need a different Chromium build than the
      # root's playwright once a bump moves one of them; this is a no-op when equal.
      - run: npx -w @iris/portal playwright install chromium
      # Sign up, verify by mail, log in/out, reset, rate limits: the build above,
      # real Postgres, real SMTP (#249).
      - run: npm run e2e -w @iris/portal
        env:
          IRIS_TEST_DATABASE_URL: postgres://iris:iris@localhost:5432/postgres
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm audit --omit=dev --audit-level=high

  # Build and deploy the container to staging (issue #192).
  #
  # Only on a merge to main, and only after `build` is green — a deploy is not a
  # place to discover a failing test. Skips itself cleanly when the environment's
  # secrets are absent, so a fork or a repo without them gets a green CI rather
  # than a permanently red job it cannot fix.
  #
  # Secrets come from the `staging` GitHub Environment rather than the repo, so
  # the names below are unqualified (HOST, USER, ...) and a `production`
  # environment can later hold different values under the same names. That is
  # also what makes IRIS_CONNECT_TOKEN per-environment: it is the credential to
  # one running service, and a repo-wide value would let a staging leak drive
  # the production browser.
  #
  # NETWORK PATH — the VPS firewalls port 22 off the public internet (the exact
  # rules are in the operator's runbook, not here: this repo is public), so a
  # GitHub-hosted runner cannot ssh in directly; it times out after ~2min.
  # The runner joins the tailnet instead. Consequences:
  #   * HOST must be the box's tailnet MagicDNS name (…​.ts.net) or 100.x
  #     address. Its public IP will hang and then fail.
  #   * SSH_KNOWN_HOSTS must be labelled with that same HOST value — a
  #     known_hosts entry is keyed by the hostname you connect as.
  #   * The tailnet ACL must let `tag:ci` reach the box on port 22.
  # Mirrors the working setup in frankbria/narrative-modeling-app (its #384) and
  # frankbria/codeframe.
  deploy-staging:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write # push the image to GHCR
    # Two merges in quick succession must not interleave a half-pulled image.
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      # Everything below is pointless without a target. Checked once, up front,
      # so the job reports "skipped, no secrets" instead of failing five steps in
      # with an opaque ssh error.
      - id: preflight
        # Secrets travel via `env`, never interpolated into the script body with
        # `${{ }}`. A `${{ }}` expansion is substituted as literal text before
        # bash sees it, so a value containing shell metacharacters would execute
        # — the standard Actions script-injection footgun. Through `env` the
        # value is only ever a variable.
        # Mapped to DEPLOY_* rather than used under their own names: a shell
        # variable called USER would shadow the runner's own $USER, which is the
        # kind of thing that works until something downstream reads it.
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.USER }}
          DEPLOY_SSH_KEY: ${{ secrets.SSH_KEY }}
          IRIS_CONNECT_TOKEN: ${{ secrets.IRIS_CONNECT_TOKEN }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          # Secrets pasted into a web form pick up stray whitespace: a leading
          # space or a trailing newline is invisible in the UI and survives into
          # the value. That cost a deploy attempt — ssh reported "hostname
          # contains invalid characters" and tailscale logged
          # `lookup  ***: no such host` with a visible gap before the host.
          #
          # Neither a hostname nor a username may contain whitespace, so stripping
          # it is always safe here and never changes a legitimate value.
          DEPLOY_HOST=$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')
          DEPLOY_USER=$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')

          # All six, not just the two the ssh call needs first. Checking a
          # subset meant a missing USER or IRIS_CONNECT_TOKEN still built and
          # pushed an image before failing at scp — work done and a registry tag
          # moved, for a deploy that was never going to land.
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] \
             || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$IRIS_CONNECT_TOKEN" ] \
             || { [ -z "$TS_AUTHKEY" ] \
                  && { [ -z "$TS_OAUTH_CLIENT_ID" ] || [ -z "$TS_OAUTH_SECRET" ]; }; }; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging secrets not configured - skipping deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            # The `secrets` context is unavailable in a step-level `if`, so the
            # credential choice travels as an output instead.
            if [ -n "$TS_AUTHKEY" ]; then
              echo "ts_auth=authkey" >> "$GITHUB_OUTPUT"
            else
              echo "ts_auth=oauth" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Before any step that touches the box. Without this the deploy step spends
      # ~2 minutes in a TCP connect and dies with "Connection timed out", which
      # reads like the host being down rather than the runner being unroutable.
      # Either credential works, and TS_AUTHKEY takes precedence when set.
      #
      # An auth key carries its tag already; an OAuth client mints one and must
      # request tags explicitly — see the tags: line below for the rule that
      # matters there.
      - if: steps.preflight.outputs.ts_auth == 'authkey'
        name: Join the tailnet (auth key)
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - if: steps.preflight.outputs.ts_auth == 'oauth'
        name: Join the tailnet (OAuth)
        # v4.1.3 to match frankbria/auto-author, the working precedent on this
        # fleet, rather than the older v3.3.0 this started on.
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          # BOTH tags. Tailscale requires the requested set to match the OAuth
          # client's FULL tag set, not a subset — this client carries tag:ci and
          # tag:staging-server, and asking for either alone returns
          #   400 "requested tags [tag:ci] are invalid or not permitted"
          # which reads as a permissions problem and is actually an exact-match
          # rule. auto-author verified it against the API: [tag:ci] 400,
          # [tag:staging-server] 400, [tag:ci,tag:staging-server] SUCCESS.
          #
          # This cost five deploy attempts. codeframe and narrative-modeling-app
          # use `tags: tag:ci` only because their clients carry that single tag,
          # so their request is already the full set — copying their line without
          # checking this client's tags is what produced the 400s.
          #
          # If this client's tags change, this line changes with them.
          tags: tag:ci,tag:staging-server

      # tailscale/github-action reports outcome=success even when every attempt to
      # bring the tunnel up failed — observed on run 31447624977, where five
      # consecutive 400s ("requested tags [tag:ci] are invalid or not permitted")
      # still produced a green step. Everything downstream then failed three
      # minutes later with an opaque ssh timeout.
      #
      # So verify rather than trust: BackendState is "Running" only once the
      # daemon is authenticated ("NeedsLogin", "Stopped" otherwise). Read that
      # field alone — plain `tailscale status` lists every peer's name and
      # address, and this log is public.
      - if: steps.preflight.outputs.configured == 'true'
        name: Assert the tailnet is actually up
        run: |
          set -uo pipefail
          state=$(tailscale status --json 2>/dev/null | jq -r '.BackendState // "unknown"')
          if [ "$state" != "Running" ]; then
            echo "::error::Joined the tailnet in name only - tailscale reports: ${state:-unknown}"
            echo "The join step above reports success even when every attempt failed; read its log."
            echo "If joining by OAuth and the log shows"
            echo "  400 'requested tags [...] are invalid or not permitted'"
            echo "then the requested tags do not MATCH the client's full tag set. Tailscale"
            echo "requires an exact match, not a subset: a client carrying tag:ci and"
            echo "tag:staging-server rejects a request for either one alone. Compare the"
            echo "tags: line in this workflow against the client's tags in the Tailscale"
            echo "admin console. It is not an ACL problem."
            echo "Alternative: set TS_AUTHKEY to a reusable, ephemeral, tagged auth key - it"
            echo "carries its tag already, and this workflow prefers it when present."
            exit 1
          fi
          echo "tailnet up: $state"

      - if: steps.preflight.outputs.configured == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.preflight.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v4

      # Tagged with the commit SHA as well as `staging`, because that is what
      # makes rollback a one-liner: redeploy a previous SHA.
      - if: steps.preflight.outputs.configured == 'true'
        id: iris_image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The portal image (#273), same tags in its own package. Staging does not run
      # the portal yet; the step after the deploy boots this exact digest instead.
      - if: steps.preflight.outputs.configured == 'true'
        id: portal_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.portal
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-portal:${{ github.sha }}
            ghcr.io/${{ github.repository }}-portal:staging
          cache-from: type=gha,scope=portal
          cache-to: type=gha,mode=max,scope=portal

      - if: steps.preflight.outputs.configured == 'true'
        name: Deploy and smoke test
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.USER }}
          DEPLOY_SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          IRIS_CONNECT_TOKEN: ${{ secrets.IRIS_CONNECT_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Trimmed here too: step `env:` blocks are independent, so the cleaning
          # done in preflight does not carry across.
          DEPLOY_HOST=$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')
          DEPLOY_USER=$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')
          # Actions masks a secret only as stored. If the stored HOST carried
          # whitespace, the trimmed value no longer matches it and would print in
          # clear wherever ssh or the diagnosis below echoes it.
          echo "::add-mask::$DEPLOY_HOST"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Prefer a pinned host key when one is configured. ssh-keyscan is
          # trust-on-first-use: it accepts whatever key answers at that moment,
          # so it authenticates nothing against an active MITM. Set
          # SSH_KNOWN_HOSTS in the environment to close that.
          if [ -n "${DEPLOY_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS not set in this environment - falling back to ssh-keyscan (TOFU)."
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          # Reachability, checked directly rather than inferred from the shape of
          # the hostname. An earlier version pattern-matched HOST against
          # *.ts.net|100.* — which rejects a trailing-dot FQDN (what
          # `tailscale status --json` prints) and a bare MagicDNS short name, both
          # of which route perfectly well. Guessing from the string blocked valid
          # configuration while proving nothing about the actual property.
          #
          # ConnectTimeout is what makes this cheap: a wrong or firewalled HOST
          # now reports in ~10s with ssh's own diagnosis instead of hanging for
          # the full TCP timeout.
          if ! ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10 \
                 "$DEPLOY_USER@$DEPLOY_HOST" true 2>/tmp/ssh-probe.err; then
            echo "::error::Cannot open a session to HOST:22 from this runner."
            echo "ssh said:"; sed 's/^/  /' /tmp/ssh-probe.err

            # Evidence rather than a list of guesses. Three prior attempts were
            # each diagnosed by inference and two of those inferences were wrong,
            # so gather the facts that actually separate the causes.
            #
            # None of this prints HOST itself: it is a registered secret. Nor
            # does it print raw tailscale output — that carries peer names,
            # tailnet addresses and the box's public endpoint, and this log is
            # public. Only derived verdicts reach it.
            # Whole block in a subshell with -e and pipefail OFF: diagnostics must
            # never themselves fail the step. The explicit `exit 1` below is what
            # ends the step.
            (
              set +e +o pipefail
              echo "--- diagnosis ---"
              # No HOST shape check. It produced a false negative twice: it
              # rejects a bare MagicDNS short name, which routes perfectly well,
              # and it told a maintainer their correct HOST was wrong. The
              # reachability probe above already tests the property this was
              # guessing at.
              # The quotes matter: they are what made a leading space in HOST
              # visible at all. Do not remove them.
              echo "resolving HOST as: '$DEPLOY_HOST'"
              echo "runner tailnet state: $(tailscale status --json 2>/dev/null | jq -r '.BackendState // "unknown"')"
              # `tailscale ping` is a disco ping, which tailnet ACLs do not
              # filter — so a pong alongside a failed ssh points at the ACL or
              # the box itself, while no pong means HOST is not a usable peer.
              ping_out=$(timeout 20 tailscale ping --timeout=5s --c=3 "$DEPLOY_HOST" 2>&1)
              case "$ping_out" in
                *pong*) verdict="pong" ;;
                *"no matching peer"* | *"error looking up"*) verdict="no peer found" ;;
                *) verdict="no reply" ;;
              esac
              echo "tailscale ping: $verdict"
              echo "-----------------"
            )
            echo "Read it as:"
            echo "  state not Running -> the tailnet join failed; see the assert step above."
            echo "  pong              -> HOST is on the tailnet; the ACL must allow tag:ci ->"
            echo "                       the box on :22, and sshd must be listening there."
            echo "  no peer found     -> HOST names something not on this tailnet. Note a bare"
            echo "                       MagicDNS short name IS valid here - do not assume the"
            echo "                       hostname is wrong just because it is not *.ts.net."
            echo "  no reply          -> HOST is a known peer that did not answer (offline?)."
            exit 1
          fi

          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /opt/iris/docker'
          scp -i ~/.ssh/deploy_key docker-compose.staging.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/iris/docker-compose.yml"
          # Referenced by the compose file's security_opt; without it the
          # sandboxed Chromium cannot start (#332).
          scp -i ~/.ssh/deploy_key docker/seccomp-chromium.json \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/iris/docker/seccomp-chromium.json"

          # compose reads .env automatically; it no longer carries the token.
          printf 'IRIS_TAG=%s\n' "$IMAGE_TAG" > /tmp/iris.env
          scp -i ~/.ssh/deploy_key /tmp/iris.env "$DEPLOY_USER@$DEPLOY_HOST:/opt/iris/.env"
          rm -f /tmp/iris.env

          # The token becomes the compose secret file (#332), sent over ssh's
          # STDIN rather than on the remote command line, which every other user
          # of this shared box can read in the process list. The container sees
          # the host file's owner and mode through the bind mount, so it must be
          # readable by pwuser (uid 1001); the 0700 directory keeps whoever holds
          # uid 1001 on the host out.
          printf '%s' "$IRIS_CONNECT_TOKEN" | ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" '
            set -eu
            umask 077
            install -d -m 700 /opt/iris/secrets
            cat > /opt/iris/secrets/connect_token
            chown 1001:1001 /opt/iris/secrets/connect_token
            chmod 400 /opt/iris/secrets/connect_token
          '

          # Postgres credentials (#248), generated ON the box so the password never
          # travels. Once: postgres reads POSTGRES_PASSWORD_FILE only when it first
          # initialises its volume, so a new password on every deploy would lock
          # the server out of its own database. The URL is derived every time.
          # Owners follow the bind mount: postgres runs as uid 70 in the alpine
          # image, pwuser as 1001.
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" '
            set -eu
            umask 077
            cd /opt/iris/secrets
            if [ ! -s pg_password ]; then
              head -c 32 /dev/urandom | od -An -tx1 | tr -d " \n" > pg_password
            fi
            printf "postgres://iris:%s@postgres:5432/iris" "$(cat pg_password)" > database_url
            chown 70:70 pg_password
            chown 1001:1001 database_url
            chmod 400 pg_password database_url
          '

          # The box has to authenticate to GHCR: a newly published package is
          # private by default even for a public repo, so an anonymous pull fails
          # with "unauthorized".
          #
          # The token arrives over ssh's STDIN, not as an argument — a remote
          # command line is readable in the host's process list by every other
          # user on this shared box. And it is the run-scoped GITHUB_TOKEN rather
          # than a stored PAT, so nothing long-lived is left behind; the logout
          # below drops even that.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

          # `docker compose up -d` derives running state from these files, so
          # this is idempotent: re-running leaves the same healthy state rather
          # than stacking another copy.
          #
          # --force-recreate because compose hashes the secret's mount spec, not
          # the file's content: a re-run of the same SHA after rotating the token
          # would keep the old container serving the old token while the
          # healthcheck reads the new one. A new SHA recreates anyway.
          #
          # `|| :` on the logout so a registry hiccup at teardown cannot fail an
          # otherwise-good deploy; the credential is short-lived regardless.
          #
          # Migrations run between pull and up, from the NEW image (#248, ADR 0001
          # §2): a failed migration stops the deploy while the old container keeps
          # serving. Idempotent, so a re-run applies nothing. Postgres is brought up
          # on its own and recreated only when its config changed; --force-recreate
          # applies to iris alone, so a deploy does not bounce the database.
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /opt/iris && docker compose pull --quiet \
             && docker compose up -d --wait postgres \
             && docker compose run --rm --no-deps --entrypoint node iris dist/db/migrate.js \
             && docker compose up -d --force-recreate --no-deps --remove-orphans iris; \
             rc=$?; docker logout ghcr.io >/dev/null 2>&1 || :; exit $rc'

          # Smoke test: wait for the container's own healthcheck to report
          # healthy, then fail the job if it does not. The healthcheck completes
          # an authenticated JSON-RPC round trip, so "healthy" means the service
          # actually serves — not merely that a port is open.
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" '
            set -eu
            for i in $(seq 1 30); do
              status=$(docker inspect -f "{{.State.Health.Status}}" iris-staging 2>/dev/null || echo missing)
              [ "$status" = healthy ] && { echo "healthy after ${i}0s"; exit 0; }
              [ "$status" = unhealthy ] && break
              sleep 10
            done
            echo "iris-staging did not become healthy; last status: ${status:-unknown}"
            docker logs --tail 50 iris-staging 2>&1 || true
            exit 1
          '

          # The periodic healthcheck stops short of the browser on purpose, so
          # prove that layer once, here. Through the launch factory every
          # session uses (dist/browser.js, #331), so it launches sandboxed under
          # the container's real seccomp profile and capabilities (#332): a host
          # that still blocks the sandbox fails here, not at a user's first
          # session. Not the
          # `launchBrowser` RPC: that RPC answers "Browser launched
          # successfully" without starting one (protocol.ts:346 returns
          # page: null), so a check built on it passes with Chromium deleted.
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            'docker exec -w /app iris-staging node -e "require(\"./dist/browser\").launchBrowser().then(b=>b.close()).then(()=>console.log(\"chromium ok\"))"'

          # Independent of both: prove the shipped CLI runs.
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            'docker exec iris-staging node dist/cli.js --version'

      # The pushed portal digest serves /login (it needs no database or SMTP for that
      # page), on the runner: staging has no portal service yet.
      - if: steps.preflight.outputs.configured == 'true'
        name: Boot the portal image
        env:
          PORTAL_REF: ghcr.io/${{ github.repository }}-portal@${{ steps.portal_image.outputs.digest }}
        run: |
          set -euo pipefail
          docker run -d --name portal-smoke -p 127.0.0.1:3000:3000 --read-only \
            --cap-drop ALL --security-opt no-new-privileges:true "$PORTAL_REF"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login || :)
            [ "$code" = 200 ] && { echo "portal /login 200 after ${i}s"; exit 0; }
            sleep 1
          done
          docker logs portal-smoke 2>&1 | tail -30
          exit 1

      # The record production promotes from (#273): `staged-<sha>` on both images,
      # pointing at the digests this job just deployed and smoke-tested. A new tag on
      # the same manifest, no rebuild. Last, so a failed deploy records nothing.
      - if: steps.preflight.outputs.configured == 'true'
        name: Record the staged digests
        env:
          REPO: ghcr.io/${{ github.repository }}
          SHA: ${{ github.sha }}
          IRIS_DIGEST: ${{ steps.iris_image.outputs.digest }}
          PORTAL_DIGEST: ${{ steps.portal_image.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$REPO:staged-$SHA" "$REPO@$IRIS_DIGEST"
          docker buildx imagetools create --tag "$REPO-portal:staged-$SHA" "$REPO-portal@$PORTAL_DIGEST"

  # Promote what staging ran to production (issue #273, docs/runbook-production.md).
  #
  # On a `v*` tag push, or a manual run from a `v*` tag. Never builds or retags: it resolves the
  # tag's commit, requires the `staged-<sha>` tags deploy-staging writes after a
  # successful deploy, and deploys those exact digests with deploy/deploy.sh, which
  # gates on the SMTP check and the migrations and rolls back on failed health.
  #
  # Secrets come from the `production` environment (same names as staging's plus the
  # portal's); unlike staging, missing secrets fail the job: a release tag that
  # did not deploy must not look green. Network path and ssh hardening as in
  # deploy-staging, whose comments explain them.
  deploy-production:
    needs: build
    # The ref must be a `v*` tag for a dispatch too: a dispatch input would let a run
    # from any branch reach the production environment. The security boundary is the
    # protected `v*` tags plus the environment's tag-only rule and required reviewer
    # (docs/runbook-production.md), not `staged-<sha>`.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      packages: read # resolve the staged digests; the box pulls with this token
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      DEPLOY_DIR: /opt/iris-production
    steps:
      - name: Check the tag
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9A-Za-z._-]+$'; then
            echo "::error::Not a release tag: '$RELEASE_TAG'"
            exit 1
          fi

      - uses: actions/checkout@v7

      - id: preflight
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.USER }}
          DEPLOY_SSH_KEY: ${{ secrets.SSH_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          missing=''
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY BETTER_AUTH_SECRET SMTP_URL PORTAL_URL SMTP_FROM; do
            [ -n "$(printf '%s' "${!name}" | tr -d '[:space:]')" ] || missing="$missing $name"
          done
          if [ -z "$TS_AUTHKEY" ] && { [ -z "$TS_OAUTH_CLIENT_ID" ] || [ -z "$TS_OAUTH_SECRET" ]; }; then
            missing="$missing TS_AUTHKEY(or TS_OAUTH_CLIENT_ID+TS_OAUTH_SECRET)"
          fi
          if [ -n "$missing" ]; then
            echo "::error::The production environment is missing:$missing (see docs/runbook-production.md)"
            exit 1
          fi
          case "$PORTAL_URL" in https://*) ;; *) echo "::error::PORTAL_URL must be https"; exit 1 ;; esac
          # settings.env is compose's .env syntax: one line, single-quoted.
          case "$PORTAL_URL$SMTP_FROM" in *"'"* | *$'\n'*) echo "::error::PORTAL_URL/SMTP_FROM may not hold ' or a newline"; exit 1 ;; esac
          if [ -n "$TS_AUTHKEY" ]; then echo "ts_auth=authkey" >> "$GITHUB_OUTPUT"; else echo "ts_auth=oauth" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # Refuse a commit staging never deployed: its `staged-<sha>` tags exist only
      # after deploy-staging succeeded on it. Pinned by digest from here on.
      - id: digests
        name: Resolve the staged digests
        env:
          REPO: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse 'HEAD^{commit}') # the checkout is the tag's commit
          resolve() {
            local digest
            if ! digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$1:staged-$sha" 2>/dev/null); then
              echo "::error::$1:staged-$sha does not exist: staging has not deployed $RELEASE_TAG ($sha)" >&2
              return 1
            fi
            printf '%s@%s' "$1" "$digest" | grep -E '^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$'
          }
          iris=$(resolve "$REPO")
          portal=$(resolve "$REPO-portal")
          echo "Deploying $RELEASE_TAG ($sha): $iris $portal"
          { echo "iris=$iris"; echo "portal=$portal"; } >> "$GITHUB_OUTPUT"

      - if: steps.preflight.outputs.ts_auth == 'authkey'
        name: Join the tailnet (auth key)
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - if: steps.preflight.outputs.ts_auth == 'oauth'
        name: Join the tailnet (OAuth)
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          # Must equal the OAuth client's FULL tag set (see deploy-staging).
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}

      - name: Assert the tailnet is actually up
        run: |
          state=$(tailscale status --json 2>/dev/null | jq -r '.BackendState // "unknown"')
          [ "$state" = Running ] || { echo "::error::tailnet not up: $state (see deploy-staging's notes)"; exit 1; }

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.USER }}
          DEPLOY_SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          IRIS_API_PORT: ${{ vars.IRIS_API_PORT }}
          PORTAL_PORT: ${{ vars.PORTAL_PORT }}
          IRIS_SECURITY_CONTACT: ${{ vars.IRIS_SECURITY_CONTACT }}
          IRIS_ABUSE_CONTACT: ${{ vars.IRIS_ABUSE_CONTACT }}
          IRIS_SUPPORT_CONTACT: ${{ vars.IRIS_SUPPORT_CONTACT }}
          IRIS_SECURITY_TXT_EXPIRES_DAYS: ${{ vars.IRIS_SECURITY_TXT_EXPIRES_DAYS }}
          IRIS_IMAGE: ${{ steps.digests.outputs.iris }}
          PORTAL_IMAGE: ${{ steps.digests.outputs.portal }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOY_HOST=$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')
          DEPLOY_USER=$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')
          echo "::add-mask::$DEPLOY_HOST"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Production requires a pinned host key: no trust-on-first-use.
          if [ -z "${DEPLOY_SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::Set SSH_KNOWN_HOSTS in the production environment"
            exit 1
          fi
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          # Keepalives: a box that stops answering mid-deploy fails the step in about a
          # minute instead of holding it until the job timeout.
          ssh_opts=(-i ~/.ssh/deploy_key -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          # Paths and digests in the remote commands expand here, on the runner, on purpose.
          # shellcheck disable=SC2029
          box() { ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "$@"; }

          # Each run stages its own release directory; the serving one is not touched
          # until deploy.sh's SMTP and migration gates pass (see deploy/deploy.sh).
          release="$DEPLOY_DIR/releases/$RELEASE_TAG-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          box "set -eu; umask 077; install -d -m 700 $DEPLOY_DIR/releases $DEPLOY_DIR/shared $DEPLOY_DIR/shared/secrets
            install -d -m 700 $release $release/docker $release/secrets $release/systemd"
          scp "${ssh_opts[@]}" docker-compose.production.yml "$DEPLOY_USER@$DEPLOY_HOST:$release/docker-compose.yml"
          scp "${ssh_opts[@]}" docker/seccomp-chromium.json "$DEPLOY_USER@$DEPLOY_HOST:$release/docker/seccomp-chromium.json"
          scp "${ssh_opts[@]}" deploy/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:$release/deploy.sh"
          # Backups (#274): shipped for the operator to review and install as root-owned
          # copies; the deploy never runs or installs them (docs/runbook-production.md).
          # Watchdog (#275) and retention (#349): the same, installed as root-owned copies.
          scp "${ssh_opts[@]}" deploy/backup.sh deploy/restore.sh deploy/watchdog.sh deploy/retention.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$release/"
          scp "${ssh_opts[@]}" deploy/systemd/iris-backup.service deploy/systemd/iris-backup.timer \
            deploy/systemd/iris-backup-failed.service deploy/systemd/iris-watchdog.service \
            deploy/systemd/iris-watchdog.timer deploy/systemd/iris-retention.service \
            deploy/systemd/iris-retention.timer "$DEPLOY_USER@$DEPLOY_HOST:$release/systemd/"
          # Host ports only when set (defaults 4000 / 3000, nginx's upstreams).
          {
            printf "PORTAL_URL='%s'\nSMTP_FROM='%s'\n" "$PORTAL_URL" "$SMTP_FROM"
            [ -z "$IRIS_API_PORT" ] || printf 'IRIS_API_PORT=%d\n' "$IRIS_API_PORT"
            [ -z "$PORTAL_PORT" ] || printf 'PORTAL_PORT=%d\n' "$PORTAL_PORT"
            # Published contacts (#348), optional: unset shows a placeholder on /contact,
            # and no security.txt is served without a security contact.
            for name in IRIS_SECURITY_CONTACT IRIS_ABUSE_CONTACT IRIS_SUPPORT_CONTACT IRIS_SECURITY_TXT_EXPIRES_DAYS; do
              value=${!name}
              [ -n "$value" ] || continue
              case "$value" in *"'"* | *$'\n'*) echo "::error::$name may not hold ' or a newline" >&2; exit 1 ;; esac
              printf "%s='%s'\n" "$name" "$value"
            done
          } | box "cat > $release/settings.env"

          # This release's secrets, over ssh's STDIN, never a remote command line (the
          # process list of a shared box is readable by every user). Read by uid 1001
          # (pwuser, and the portal image's user).
          put_secret() {
            printf '%s' "$2" | box "set -eu; umask 077; cd $release/secrets
              cat > $1 && chown 1001:1001 $1 && chmod 400 $1"
          }
          put_secret better_auth_secret "$BETTER_AUTH_SECRET"
          put_secret smtp_url "$SMTP_URL"

          # Shared, generated ON the box once and never overwritten: the Postgres
          # password (the volume keeps the one it was initialised with) and the BYOK
          # master key (it seals every org's stored provider key; losing it loses them).
          # Back both up apart from the database (#274). The URL is derived, and
          # replaced only if it differs, since serving containers mount it.
          box "set -eu; umask 077; cd $DEPLOY_DIR/shared/secrets
            if [ ! -s pg_password ]; then head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > pg_password; chown 70:70 pg_password; chmod 400 pg_password; fi
            if [ ! -s master_key ]; then printf 'k1:%s' \"\$(head -c 32 /dev/urandom | base64 | tr -d '\n')\" > master_key; chown 1001:1001 master_key; chmod 400 master_key; fi
            printf 'postgres://iris:%s@postgres:5432/iris' \"\$(cat pg_password)\" > database_url.new
            if cmp -s database_url.new database_url; then rm database_url.new; else
              chown 1001:1001 database_url.new; chmod 400 database_url.new; mv database_url.new database_url; fi"

          printf '%s' "$GHCR_TOKEN" | box "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          # The refs were checked against ghcr.io/...@sha256:<64 hex> above, so they
          # are safe on this command line.
          box "cd $release && chmod 700 deploy.sh backup.sh restore.sh watchdog.sh retention.sh \
            && IRIS_IMAGE='$IRIS_IMAGE' PORTAL_IMAGE='$PORTAL_IMAGE' ./deploy.sh; \
            rc=\$?; docker logout ghcr.io >/dev/null 2>&1 || :; exit \$rc"
