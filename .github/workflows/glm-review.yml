name: GLM Review
on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"

jobs:
  review:
    # Skip Dependabot: its PRs run against the Dependabot secret store, where
    # MODEL_API_KEY is absent, so the review aborts on an empty key and leaves a
    # phantom failing check on an otherwise-green bump.
    # Otherwise, only review substantial changes (5+ files, or 20+ additions, or 20+ deletions)
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event.pull_request.changed_files >= 5 ||
       github.event.pull_request.additions >= 20 ||
       github.event.pull_request.deletions >= 20)
    uses: frankbria/glm-review/.github/workflows/review.yml@main
    with:
      base_url: https://api.kimi.com/coding/
      model: k3[1m]
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    secrets:
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
